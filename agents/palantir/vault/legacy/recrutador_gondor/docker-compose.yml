version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.orochidrake.com.br
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.orochidrake.com.br/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./n8n_data:/home/node/.n8n

  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=gandalf
      - POSTGRES_PASSWORD=mithril_shield
      - POSTGRES_DB=recrutador_gondor
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  recrutador-ui:
    image: nginx:alpine
    restart: always
    ports:
      - "3050:80"
    volumes:
      - ./ui_dist:/usr/share/nginx/html

  api-vagas:
    image: python:3.10-slim
    restart: always
    ports:
      - "5050:5050"
    volumes:
      - ./api_server.py:/app/api_server.py
    working_dir: /app
    command: sh -c "pip install flask flask-cors psycopg2-binary && python api_server.py"
